<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="370" viewBox="0 0 1280 370" role="img" aria-label="One tick of live narration: motion gate, three-frame clip, Gemini live tier, server guards, announce. Memory feeds into the next look."><title>One tick of live narration: motion gate, three-frame clip, Gemini live tier, server guards, announce. Memory feeds into the next look.</title><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0F172A"/><stop offset="1" stop-color="#0B0F19"/></linearGradient><marker id="ma" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.8 L9.5 5 L0 9.2 z" fill="#94A3B8"/></marker><marker id="mb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.8 L9.5 5 L0 9.2 z" fill="#60A5FA"/></marker><marker id="my" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.8 L9.5 5 L0 9.2 z" fill="#FFD60A"/></marker><marker id="mg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.8 L9.5 5 L0 9.2 z" fill="#34D399"/></marker><marker id="mr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.8 L9.5 5 L0 9.2 z" fill="#F87171"/></marker><marker id="mp" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.8 L9.5 5 L0 9.2 z" fill="#A78BFA"/></marker><marker id="mi" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.8 L9.5 5 L0 9.2 z" fill="#6C8CFF"/></marker></defs><rect width="1280" height="370" rx="18" fill="url(#bg)"/><text x="40" y="44" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" font-weight="750" fill="#F1F5F9" text-anchor="start">One tick of live narration</text><text x="40" y="70" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#94A3B8" text-anchor="start">Standing still costs nothing. The model's answer never reaches the speaker unchecked.</text><rect x="40" y="100" width="216" height="136" rx="14" fill="#121A2B" stroke="#26324A" stroke-width="1.5"/><rect x="52" y="112" width="28" height="28" rx="8" fill="#60A5FA" fill-opacity=".14"/><g transform="translate(57 117) scale(0.75)" fill="none" stroke="#60A5FA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-2.48a2 2 0 0 0-1.93 1.46l-2.35 8.36a.25.25 0 0 1-.48 0L9.24 2.18a.25.25 0 0 0-.48 0l-2.35 8.36A2 2 0 0 1 4.49 12H2" /></g><text x="90" y="131" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="650" fill="#F1F5F9" text-anchor="start">1. Motion gate</text><text x="56" y="158" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#94A3B8" text-anchor="start">Compare thumbnails.</text><text x="56" y="178" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#94A3B8" text-anchor="start">Moved, or ~10 s</text><text x="56" y="198" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#94A3B8" text-anchor="start">passed. Else silence.</text><path d="M257 168 H275" fill="none" stroke="#60A5FA" stroke-width="2.2" marker-end="url(#mb)"/><rect x="276" y="100" width="216" height="136" rx="14" fill="#121A2B" stroke="#26324A" stroke-width="1.5"/><rect x="288" y="112" width="28" height="28" rx="8" fill="#60A5FA" fill-opacity=".14"/><g transform="translate(293 117) scale(0.75)" fill="none" stroke="#60A5FA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2" />
  <path d="M7 3v18" />
  <path d="M3 7.5h4" />
  <path d="M3 12h18" />
  <path d="M3 16.5h4" />
  <path d="M17 3v18" />
  <path d="M17 7.5h4" />
  <path d="M17 16.5h4" /></g><text x="326" y="131" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="650" fill="#F1F5F9" text-anchor="start">2. Clip</text><text x="292" y="158" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#94A3B8" text-anchor="start">3 frames over ~2 s,</text><text x="292" y="178" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#94A3B8" text-anchor="start">plus the turn angle</text><text x="292" y="198" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#94A3B8" text-anchor="start">from the gyro.</text><path d="M493 168 H511" fill="none" stroke="#60A5FA" stroke-width="2.2" marker-end="url(#mb)"/><rect x="512" y="100" width="216" height="136" rx="14" fill="#121A2B" stroke="#26324A" stroke-width="1.5"/><rect x="524" y="112" width="28" height="28" rx="8" fill="#A78BFA" fill-opacity=".14"/><g transform="translate(529 117) scale(0.75)" fill="none" stroke="#A78BFA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 18V5" />
  <path d="M15 13a4.17 4.17 0 01-3-4 4.17 4.17 0 01-3 4" />
  <path d="M17.707 6.294A3 3 0 1012 5a3 3 0 10-5.707 1.294" />
  <path d="M17.996 5.125a4 4 0 012.526 5.77" />
  <path d="M18 18a4 4 0 002-7.465" />
  <path d="M19.967 17.482a4 4 0 11-7.967.517 4 4 0 11-7.967-.517" />
  <path d="M6 18a4 4 0 01-2-7.465" />
  <path d="M6.004 5.125a4 4 0 00-2.526 5.77" /></g><text x="562" y="131" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="650" fill="#F1F5F9" text-anchor="start">3. Gemini live tier</text><text x="528" y="158" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#94A3B8" text-anchor="start">Facts first: view,</text><text x="528" y="178" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#94A3B8" text-anchor="start">hazard, goal side.</text><text x="528" y="198" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#94A3B8" text-anchor="start">Then the line to say.</text><path d="M729 168 H747" fill="none" stroke="#60A5FA" stroke-width="2.2" marker-end="url(#mb)"/><rect x="748" y="100" width="216" height="136" rx="14" fill="#121A2B" stroke="#26324A" stroke-width="1.5"/><rect x="760" y="112" width="28" height="28" rx="8" fill="#34D399" fill-opacity=".14"/><g transform="translate(765 117) scale(0.75)" fill="none" stroke="#34D399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z" />
  <path d="m9 12 2 2 4-4" /></g><text x="798" y="131" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="650" fill="#F1F5F9" text-anchor="start">4. Server guards</text><text x="764" y="158" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#94A3B8" text-anchor="start">Blurry: stand still.</text><text x="764" y="178" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#94A3B8" text-anchor="start">Never toward blocked.</text><text x="764" y="198" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#94A3B8" text-anchor="start">Near hazard: urgent.</text><path d="M965 168 H983" fill="none" stroke="#60A5FA" stroke-width="2.2" marker-end="url(#mb)"/><rect x="984" y="100" width="216" height="136" rx="14" fill="#121A2B" stroke="#26324A" stroke-width="1.5"/><rect x="996" y="112" width="28" height="28" rx="8" fill="#FFD60A" fill-opacity=".14"/><g transform="translate(1001 117) scale(0.75)" fill="none" stroke="#FFD60A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z" />
  <path d="M16 9a5 5 0 0 1 0 6" />
  <path d="M19.364 18.364a9 9 0 0 0 0-12.728" /></g><text x="1034" y="131" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="650" fill="#F1F5F9" text-anchor="start">5. Announce</text><text x="1000" y="158" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#94A3B8" text-anchor="start">Urgent cuts in.</text><text x="1000" y="178" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#94A3B8" text-anchor="start">Normal waits.</text><text x="1000" y="198" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#94A3B8" text-anchor="start">Stale is dropped.</text><path d="M1124 236 V292 H148 V238" fill="none" stroke="#A78BFA" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#mp)"/><rect x="416" y="278" width="440" height="28" rx="14" fill="#0B0F19" stroke="#26324A"/><g transform="translate(432 284) scale(0.6666666666666666)" fill="none" stroke="#A78BFA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13.4 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7.4" />
  <path d="M2 6h4" />
  <path d="M2 10h4" />
  <path d="M2 14h4" />
  <path d="M2 18h4" />
  <path d="M21.378 5.626a1 1 0 1 0-3.004-3.004l-5.01 5.012a2 2 0 0 0-.506.854l-.837 2.87a.5.5 0 0 0 .62.62l2.87-.837a2 2 0 0 0 .854-.506z" /></g><text x="456" y="297" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#F1F5F9" text-anchor="start">Memory, active hazard and recent lines go into the next look</text><text x="640" y="342" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#94A3B8" text-anchor="middle">In guide mode this same loop runs with a goal set, about every 1.5 seconds, until a second model confirms arrival.</text></svg>
