<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" role="img" aria-label="Room scan: turn once, Gemini lists objects, repeats merge into landmarks, and step counting tracks your position on the map."><title>Room scan: turn once, Gemini lists objects, repeats merge into landmarks, and step counting tracks your position on the map.</title><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0F172A"/><stop offset="1" stop-color="#0B0F19"/></linearGradient><marker id="ma" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.8 L9.5 5 L0 9.2 z" fill="#94A3B8"/></marker><marker id="mb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.8 L9.5 5 L0 9.2 z" fill="#60A5FA"/></marker><marker id="my" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.8 L9.5 5 L0 9.2 z" fill="#FFD60A"/></marker><marker id="mg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.8 L9.5 5 L0 9.2 z" fill="#34D399"/></marker><marker id="mr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.8 L9.5 5 L0 9.2 z" fill="#F87171"/></marker><marker id="mp" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.8 L9.5 5 L0 9.2 z" fill="#A78BFA"/></marker><marker id="mi" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.8 L9.5 5 L0 9.2 z" fill="#6C8CFF"/></marker></defs><rect width="1280" height="480" rx="18" fill="url(#bg)"/><text x="40" y="44" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" font-weight="750" fill="#F1F5F9" text-anchor="start">Room scan: one turn, one map</text><text x="40" y="70" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#94A3B8" text-anchor="start">Every photo keeps its heading, so an object's real direction is the heading plus where it sits in the frame.</text><rect x="40" y="100" width="610" height="76" rx="14" fill="#121A2B" stroke="#26324A" stroke-width="1.5"/><circle cx="78" cy="138" r="22" fill="#60A5FA" fill-opacity=".14"/><g transform="translate(66 126) scale(1)" fill="none" stroke="#60A5FA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" />
  <path d="m16.24 7.76-1.804 5.411a2 2 0 0 1-1.265 1.265L7.76 16.24l1.804-5.411a2 2 0 0 1 1.265-1.265z" /></g><text x="116" y="132" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="650" fill="#F1F5F9" text-anchor="start">1. Turn once</text><text x="116" y="156" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#94A3B8" text-anchor="start">A steady photo about every 28 degrees.</text><rect x="40" y="190" width="610" height="76" rx="14" fill="#121A2B" stroke="#26324A" stroke-width="1.5"/><circle cx="78" cy="228" r="22" fill="#A78BFA" fill-opacity=".14"/><g transform="translate(66 216) scale(1)" fill="none" stroke="#A78BFA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 18V5" />
  <path d="M15 13a4.17 4.17 0 01-3-4 4.17 4.17 0 01-3 4" />
  <path d="M17.707 6.294A3 3 0 1012 5a3 3 0 10-5.707 1.294" />
  <path d="M17.996 5.125a4 4 0 012.526 5.77" />
  <path d="M18 18a4 4 0 002-7.465" />
  <path d="M19.967 17.482a4 4 0 11-7.967.517 4 4 0 11-7.967-.517" />
  <path d="M6 18a4 4 0 01-2-7.465" />
  <path d="M6.004 5.125a4 4 0 00-2.526 5.77" /></g><text x="116" y="222" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="650" fill="#F1F5F9" text-anchor="start">2. List everything</text><text x="116" y="246" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#94A3B8" text-anchor="start">One careful Gemini call finds doors, windows, furniture and floor hazards.</text><rect x="40" y="280" width="610" height="76" rx="14" fill="#121A2B" stroke="#26324A" stroke-width="1.5"/><circle cx="78" cy="318" r="22" fill="#34D399" fill-opacity=".14"/><g transform="translate(66 306) scale(1)" fill="none" stroke="#34D399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z" />
  <path d="M2 12a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 12" />
  <path d="M2 17a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 17" /></g><text x="116" y="312" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="650" fill="#F1F5F9" text-anchor="start">3. Merge landmarks</text><text x="116" y="336" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#94A3B8" text-anchor="start">Repeats become one {name, heading, steps}.</text><rect x="40" y="370" width="610" height="76" rx="14" fill="#121A2B" stroke="#26324A" stroke-width="1.5"/><circle cx="78" cy="408" r="22" fill="#FFD60A" fill-opacity=".14"/><g transform="translate(66 396) scale(1)" fill="none" stroke="#FFD60A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16v-2.38C4 11.5 2.97 10.5 3 8c.03-2.72 1.49-6 4.5-6C9.37 2 10 3.8 10 5.5c0 3.11-2 5.66-2 8.68V16a2 2 0 1 1-4 0Z" />
  <path d="M20 20v-2.38c0-2.12 1.03-3.12 1-5.62-.03-2.72-1.49-6-4.5-6C14.63 6 14 7.8 14 9.5c0 3.11 2 5.66 2 8.68V20a2 2 0 1 0 4 0Z" />
  <path d="M16 17h4" />
  <path d="M4 13h4" /></g><text x="116" y="402" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="650" fill="#F1F5F9" text-anchor="start">4. Track your pose</text><text x="116" y="426" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#94A3B8" text-anchor="start">Steps and heading keep the map usable as you walk.</text><rect x="690" y="92" width="550" height="364" rx="16" fill="#121A2B" stroke="#26324A" stroke-width="1.5"/><circle cx="980" cy="256" r="150" fill="none" stroke="#26324A" stroke-width="1.4"/><circle cx="980" cy="256" r="100" fill="none" stroke="#26324A" stroke-width="1.4"/><circle cx="980" cy="256" r="50" fill="none" stroke="#26324A" stroke-width="1.4"/><line x1="980" y1="256" x2="980.0" y2="106.0" stroke="#3B82F6" stroke-opacity=".22"/><line x1="980" y1="256" x2="1050.4" y2="123.6" stroke="#3B82F6" stroke-opacity=".22"/><line x1="980" y1="256" x2="1104.4" y2="172.1" stroke="#3B82F6" stroke-opacity=".22"/><line x1="980" y1="256" x2="1129.2" y2="240.3" stroke="#3B82F6" stroke-opacity=".22"/><line x1="980" y1="256" x2="1119.1" y2="312.2" stroke="#3B82F6" stroke-opacity=".22"/><line x1="980" y1="256" x2="1076.4" y2="370.9" stroke="#3B82F6" stroke-opacity=".22"/><line x1="980" y1="256" x2="1011.2" y2="402.7" stroke="#3B82F6" stroke-opacity=".22"/><line x1="980" y1="256" x2="938.7" y2="400.2" stroke="#3B82F6" stroke-opacity=".22"/><line x1="980" y1="256" x2="875.8" y2="363.9" stroke="#3B82F6" stroke-opacity=".22"/><line x1="980" y1="256" x2="837.3" y2="302.4" stroke="#3B82F6" stroke-opacity=".22"/><line x1="980" y1="256" x2="832.3" y2="230.0" stroke="#3B82F6" stroke-opacity=".22"/><line x1="980" y1="256" x2="861.8" y2="163.7" stroke="#3B82F6" stroke-opacity=".22"/><line x1="980" y1="256" x2="919.0" y2="119.0" stroke="#3B82F6" stroke-opacity=".22"/><path d="M980 256 L980 106 A150 150 0 0 1 1106.2 175.0 Z" fill="#3B82F6" fill-opacity=".14"/><circle cx="1042.4" cy="364.1" r="7" fill="#34D399"/><text x="1054.4" y="369.0799703922979" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#F1F5F9" text-anchor="start">Exit door</text><circle cx="896.9" cy="208.0" r="7" fill="#FFD60A"/><text x="884.8615612366939" y="213" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#F1F5F9" text-anchor="end">Sofa</text><circle cx="1023.2" cy="204.5" r="7" fill="#F87171"/><text x="1035.1953273709355" y="209.52181342240468" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#F1F5F9" text-anchor="start">Box</text><circle cx="1088.4" cy="265.5" r="7" fill="#A78BFA"/><text x="1100.3859831523819" y="270.4825448109452" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#F1F5F9" text-anchor="start">Table</text><circle cx="902.9" cy="366.1" r="7" fill="#60A5FA"/><text x="890.9113269544195" y="371.0940347524405" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#F1F5F9" text-anchor="end">Window</text><circle cx="899.6" cy="277.5" r="7" fill="#A78BFA"/><text x="887.6349712527496" y="282.5337445525297" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#F1F5F9" text-anchor="end">Bed</text><circle cx="980" cy="256" r="15" fill="#FFD60A"/><g transform="translate(971 247) scale(0.75)" fill="none" stroke="#0B0F19" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="5" />
