<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="330" viewBox="0 0 1280 330" role="img" aria-label="Test rig: a three.js room and synthesised speech feed the real app, a virtual walker follows Iris's directions, and answers are scored against ground truth."><title>Test rig: a three.js room and synthesised speech feed the real app, a virtual walker follows Iris's directions, and answers are scored against ground truth.</title><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0F172A"/><stop offset="1" stop-color="#0B0F19"/></linearGradient><marker id="ma" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.8 L9.5 5 L0 9.2 z" fill="#94A3B8"/></marker><marker id="mb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.8 L9.5 5 L0 9.2 z" fill="#60A5FA"/></marker><marker id="my" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.8 L9.5 5 L0 9.2 z" fill="#FFD60A"/></marker><marker id="mg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.8 L9.5 5 L0 9.2 z" fill="#34D399"/></marker><marker id="mr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.8 L9.5 5 L0 9.2 z" fill="#F87171"/></marker><marker id="mp" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.8 L9.5 5 L0 9.2 z" fill="#A78BFA"/></marker><marker id="mi" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.8 L9.5 5 L0 9.2 z" fill="#6C8CFF"/></marker></defs><rect width="1280" height="330" rx="18" fill="url(#bg)"/><text x="40" y="44" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" font-weight="750" fill="#F1F5F9" text-anchor="start">The test rig: a virtual world around the real app</text><text x="40" y="70" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#94A3B8" text-anchor="start">No mocks in the middle. The unmodified app runs in headless Edge with its camera and microphone replaced.</text><rect x="40" y="104" width="280" height="96" rx="14" fill="#121A2B" stroke="#26324A" stroke-width="1.5"/><rect x="52" y="116" width="28" height="28" rx="8" fill="#60A5FA" fill-opacity=".14"/><g transform="translate(57 121) scale(0.75)" fill="none" stroke="#60A5FA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z" />
  <path d="m3.3 7 8.7 5 8.7-5" />
  <path d="M12 22V12" /></g><text x="90" y="135" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="650" fill="#F1F5F9" text-anchor="start">three.js room</text><text x="56" y="162" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#94A3B8" text-anchor="start">A furnished 3D room is rendered</text><text x="56" y="182" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#94A3B8" text-anchor="start">into the app as its camera.</text><rect x="40" y="212" width="280" height="96" rx="14" fill="#121A2B" stroke="#26324A" stroke-width="1.5"/><rect x="52" y="224" width="28" height="28" rx="8" fill="#6C8CFF" fill-opacity=".14"/><g transform="translate(57 229) scale(0.75)" fill="none" stroke="#6C8CFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19v3" />
  <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
  <rect x="9" y="2" width="6" height="13" rx="3" /></g><text x="90" y="243" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="650" fill="#F1F5F9" text-anchor="start">AssemblyAI TTS as the mic</text><text x="56" y="270" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#94A3B8" text-anchor="start">Spoken commands are synthesised</text><text x="56" y="290" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#94A3B8" text-anchor="start">and fed in as real audio.</text><rect x="440" y="104" width="340" height="204" rx="14" fill="#0F172A" stroke="#3B82F6" stroke-width="2"/><g transform="translate(586 128) scale(2)" fill="none" stroke="#60A5FA" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="20" x="5" y="2" rx="2" ry="2" />
  <path d="M12 18h.01" /></g><text x="610" y="212" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" font-weight="750" fill="#F1F5F9" text-anchor="middle">The real app</text><text x="610" y="240" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#94A3B8" text-anchor="middle">Real STT, Gemini and TTS calls</text><text x="610" y="264" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#94A3B8" text-anchor="middle">Own server on its own port</text><rect x="900" y="104" width="340" height="96" rx="14" fill="#121A2B" stroke="#26324A" stroke-width="1.5"/><rect x="912" y="116" width="28" height="28" rx="8" fill="#FFD60A" fill-opacity=".14"/><g transform="translate(917 121) scale(0.75)" fill="none" stroke="#FFD60A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16v-2.38C4 11.5 2.97 10.5 3 8c.03-2.72 1.49-6 4.5-6C9.37 2 10 3.8 10 5.5c0 3.11-2 5.66-2 8.68V16a2 2 0 1 1-4 0Z" />
  <path d="M20 20v-2.38c0-2.12 1.03-3.12 1-5.62-.03-2.72-1.49-6-4.5-6C14.63 6 14 7.8 14 9.5c0 3.11 2 5.66 2 8.68V20a2 2 0 1 0 4 0Z" />
  <path d="M16 17h4" />
  <path d="M4 13h4" /></g><text x="950" y="135" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="650" fill="#F1F5F9" text-anchor="start">Virtual walker</text><text x="916" y="162" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#94A3B8" text-anchor="start">Follows Iris's spoken directions and</text><text x="916" y="182" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#94A3B8" text-anchor="start">moves the camera through the room.</text><rect x="900" y="212" width="340" height="96" rx="14" fill="#121A2B" stroke="#26324A" stroke-width="1.5"/><rect x="912" y="224" width="28" height="28" rx="8" fill="#34D399" fill-opacity=".14"/><g transform="translate(917 229) scale(0.75)" fill="none" stroke="#34D399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 5h8" />
  <path d="M13 12h8" />
  <path d="M13 19h8" />
  <path d="m3 17 2 2 4-4" />
  <path d="m3 7 2 2 4-4" /></g><text x="950" y="243" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="650" fill="#F1F5F9" text-anchor="start">Scored against ground truth</text><text x="916" y="270" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#94A3B8" text-anchor="start">The scene is known, so each answer</text><text x="916" y="290" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#94A3B8" text-anchor="start">gets a pass or fail. Results go to sim/out.</text><path d="M320 152 H438" fill="none" stroke="#60A5FA" stroke-width="2.2" marker-end="url(#mb)"/><path d="M320 260 H438" fill="none" stroke="#6C8CFF" stroke-width="2.2" marker-end="url(#mi)"/><path d="M780 152 H898" fill="none" stroke="#FFD60A" stroke-width="2.2" marker-end="url(#my)"/><path d="M780 260 H898" fill="none" stroke="#34D399" stroke-width="2.2" marker-end="url(#mg)"/><path d="M1070 104 V86 H180 V102" fill="none" stroke="#FFD60A" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#my)"/><rect x="560" y="74" width="170" height="24" rx="12" fill="#0B0F19"/><text x="645" y="91" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#FFD60A" text-anchor="middle">the walker moves the view</text></svg>
