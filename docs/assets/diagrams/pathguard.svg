  <path d="M4 2C2.8 3.7 2 5.7 2 8" /></g><text x="1034" y="131" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="650" fill="#F1F5F9" text-anchor="start">Proximity beeps</text><text x="1000" y="150" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#94A3B8" text-anchor="start">Faster as it nears, panned by side</text><rect x="984" y="184" width="256" height="66" rx="14" fill="#121A2B" stroke="#26324A" stroke-width="1.5"/><rect x="996" y="196" width="28" height="28" rx="8" fill="#A78BFA" fill-opacity=".14"/><g transform="translate(1001 201) scale(0.75)" fill="none" stroke="#A78BFA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 18V5" />
