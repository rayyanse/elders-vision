<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="330" viewBox="0 0 1280 330" role="img" aria-label="Medicine flow: steady the box, the model copies the printed text, plain code composes the sentence, Iris speaks it."><title>Medicine flow: steady the box, the model copies the printed text, plain code composes the sentence, Iris speaks it.</title><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0F172A"/><stop offset="1" stop-color="#0B0F19"/></linearGradient><marker id="ma" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.8 L9.5 5 L0 9.2 z" fill="#94A3B8"/></marker><marker id="mb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.8 L9.5 5 L0 9.2 z" fill="#60A5FA"/></marker><marker id="my" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.8 L9.5 5 L0 9.2 z" fill="#FFD60A"/></marker><marker id="mg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.8 L9.5 5 L0 9.2 z" fill="#34D399"/></marker><marker id="mr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.8 L9.5 5 L0 9.2 z" fill="#F87171"/></marker><marker id="mp" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.8 L9.5 5 L0 9.2 z" fill="#A78BFA"/></marker><marker id="mi" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.8 L9.5 5 L0 9.2 z" fill="#6C8CFF"/></marker></defs><rect width="1280" height="330" rx="18" fill="url(#bg)"/><text x="40" y="44" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" font-weight="750" fill="#F1F5F9" text-anchor="start">Medicine: the model reads, the code speaks</text><text x="40" y="70" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#94A3B8" text-anchor="start">Nothing that isn't printed on the box can be spoken as fact, and Iris never suggests a dose.</text><rect x="330" y="92" width="262" height="214" rx="14" fill="#A78BFA" fill-opacity=".06" stroke="#A78BFA" stroke-width="1.5" stroke-dasharray="6 6"/><text x="461" y="116" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#A78BFA" text-anchor="middle" letter-spacing="1.5">AI MODEL</text><rect x="636" y="92" width="276" height="214" rx="14" fill="#34D399" fill-opacity=".06" stroke="#34D399" stroke-width="1.5" stroke-dasharray="6 6"/><text x="774" y="116" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#34D399" text-anchor="middle" letter-spacing="1.5">PLAIN CODE, UNIT TESTED</text><rect x="40" y="130" width="246" height="156" rx="14" fill="#121A2B" stroke="#26324A" stroke-width="1.5"/><rect x="52" y="142" width="28" height="28" rx="8" fill="#60A5FA" fill-opacity=".14"/><g transform="translate(57 147) scale(0.75)" fill="none" stroke="#60A5FA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13.997 4a2 2 0 0 1 1.76 1.05l.486.9A2 2 0 0 0 18.003 7H20a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h1.997a2 2 0 0 0 1.759-1.048l.489-.904A2 2 0 0 1 10.004 4z" />
  <circle cx="12" cy="13" r="3" /></g><text x="90" y="161" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="650" fill="#F1F5F9" text-anchor="start">Steady the box</text><text x="56" y="188" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#94A3B8" text-anchor="start">She tells you how to hold it,</text><text x="56" y="208" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#94A3B8" text-anchor="start">waits until it is steady, takes</text><text x="56" y="228" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#94A3B8" text-anchor="start">three photos and sends the</text><text x="56" y="248" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#94A3B8" text-anchor="start">two sharpest.</text><rect x="346" y="130" width="230" height="156" rx="14" fill="#121A2B" stroke="#26324A" stroke-width="1.5"/><rect x="358" y="142" width="28" height="28" rx="8" fill="#A78BFA" fill-opacity=".14"/><g transform="translate(363 147) scale(0.75)" fill="none" stroke="#A78BFA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z" />
  <path d="M14 2v5a1 1 0 0 0 1 1h5" />
  <path d="M10 9H8" />
  <path d="M16 13H8" />
  <path d="M16 17H8" /></g><text x="396" y="161" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="650" fill="#F1F5F9" text-anchor="start">Copy the text</text><text x="362" y="188" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#94A3B8" text-anchor="start">Name and version, strength,</text><text x="362" y="208" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#94A3B8" text-anchor="start">uses, dosage, warnings and</text><text x="362" y="228" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#94A3B8" text-anchor="start">expiry, exactly as printed.</text><rect x="652" y="130" width="244" height="156" rx="14" fill="#121A2B" stroke="#26324A" stroke-width="1.5"/><rect x="664" y="142" width="28" height="28" rx="8" fill="#34D399" fill-opacity=".14"/><g transform="translate(669 147) scale(0.75)" fill="none" stroke="#34D399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 16 4-4-4-4" />
  <path d="m6 8-4 4 4 4" />
  <path d="m14.5 4-5 16" /></g><text x="702" y="161" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="650" fill="#F1F5F9" text-anchor="start">Compose the line</text><text x="668" y="188" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#94A3B8" text-anchor="start">meds.js matches the name,</text><text x="668" y="208" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#94A3B8" text-anchor="start">checks the expiry and reports</text><text x="668" y="228" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#94A3B8" text-anchor="start">missing fields as missing.</text><rect x="958" y="130" width="282" height="156" rx="14" fill="#121A2B" stroke="#26324A" stroke-width="1.5"/><rect x="970" y="142" width="28" height="28" rx="8" fill="#FFD60A" fill-opacity=".14"/><g transform="translate(975 147) scale(0.75)" fill="none" stroke="#FFD60A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z" />
  <path d="M16 9a5 5 0 0 1 0 6" />
  <path d="M19.364 18.364a9 9 0 0 0 0-12.728" /></g><text x="1008" y="161" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="650" fill="#F1F5F9" text-anchor="start">Iris says</text><text x="974" y="188" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#94A3B8" text-anchor="start">"This is not plain Panadol.</text><text x="974" y="208" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#94A3B8" text-anchor="start">It's past its expiry date."</text><text x="974" y="228" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#94A3B8" text-anchor="start"></text><path d="M286 208 H344" fill="none" stroke="#60A5FA" stroke-width="2.2" marker-end="url(#mb)"/><path d="M576 208 H650" fill="none" stroke="#60A5FA" stroke-width="2.2" marker-end="url(#mb)"/><path d="M896 208 H956" fill="none" stroke="#60A5FA" stroke-width="2.2" marker-end="url(#mb)"/></svg>
